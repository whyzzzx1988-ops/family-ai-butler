# local 调试 Profile：不用 Docker、不用装 Postgres/Redis
# - 数据库：H2 内存库（PostgreSQL 兼容模式），迁移走 db/migration-h2，重启清零
# - token：内存存储（由 LocalDevConfig 的 @Primary SaTokenDao 顶替 redis 实现）
# - 用法：mvn spring-boot:run -Dspring-boot.run.profiles=local
#   或 IDE 里把 Active profiles 设为 local 后直接 Run/Debug
spring:
  datasource:
    url: jdbc:h2:mem:butler;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration-h2
  h2:
    console:
      enabled: true
      path: /h2-console
