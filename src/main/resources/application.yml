spring:
  application:
    name: family-ai-butler
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  profiles:
    # 没显式指定 Profile 时默认走 local（H2 免 Docker 调试），避免直接点 Run 去连本机 5432 报错
    # Docker 部署由 compose 注入 SPRING_PROFILES_ACTIVE=prod，不受此默认值影响
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/butler}
    username: ${DB_USER:butler}
    password: ${DB_PASSWORD:butler_dev_only}
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

# Sa-Token 鉴权配置（混合路线：登录/会话/token 用现成框架，家庭数据隔离自研）
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

butler:
  llm:
    # 密钥只走环境变量，绝不写进仓库
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    default-model: deepseek-chat
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # 参考价（元/百万 token），官方调价时改这里即可；成本落 llm_call_log 可汇总
    pricing:
      deepseek-chat:
        input-per-million: 2.0
        output-per-million: 8.0
  asr:
    # 百炼 DashScope API Key 只走环境变量；没配时语音事件落 asr_unconfigured 状态，音频照常保存
    api-key: ${DASHSCOPE_API_KEY:}
    ws-url: ${ASR_WS_URL:wss://dashscope.aliyuncs.com/api-ws/v1/inference}
    model: ${ASR_MODEL:paraformer-realtime-v2}
    timeout-seconds: 30
  inbox:
    # 语音原文件存放目录（已进 .gitignore，不入库）
    audio-dir: ${BUTLER_AUDIO_DIR:./data/audio}
  briefing:
    morning-cron: "0 0 7 * * *"
    # 周报（第七周 N3）：周一 07:30 生成 type=weekly，覆盖上周一至周日
    weekly-cron: "0 30 7 * * MON"
  learn:
    # 复习到期提醒（第七周 N1）：每晚 19:00 检查孩子名下到期条目，有才给户主推订阅消息
    review-remind-cron: "0 0 19 * * *"
  health:
    # 用药按点推送（第七周 N3）：每分钟比对在册用药计划的 remindTime
    medication-cron: "0 * * * * *"
  wechat:
    # 小程序 AppID/Secret 只走环境变量；没配时微信登录 503、密码登录不受影响
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    # 订阅消息模板 ID（公众平台申请后填；thing/date 字段名以所申请模板为准，不同模板需同步改 WechatController 的测试数据键）
    template-briefing-id: ${WECHAT_TEMPLATE_BRIEFING_ID:}
    template-review-id: ${WECHAT_TEMPLATE_REVIEW_ID:}
    template-medication-id: ${WECHAT_TEMPLATE_MEDICATION_ID:}
